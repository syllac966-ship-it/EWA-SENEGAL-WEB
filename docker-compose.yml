version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ewa-senegal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ewa_user
      POSTGRES_PASSWORD: ewa_password
      POSTGRES_DB: ewa_senegal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewa_user -d ewa_senegal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
